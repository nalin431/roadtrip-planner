<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Trip Planner Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Basic Trip Planner Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Basic Trip Creation</h2>
        <button onclick="testBasicTrip()">Test Basic Trip</button>
        <div id="test1-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Day Plan Creation</h2>
        <button onclick="testDayPlans()">Test Day Plans</button>
        <div id="test2-result"></div>
    </div>

    <script>
        // Mock trip plan structure
        const mockTripPlan = {
            id: 'test-trip',
            name: 'Test Trip',
            startPoint: 'Chicago',
            endPoint: 'New York',
            isReturnTrip: false,
            totalDays: 3,
            stops: [
                { id: 'start', name: 'Start', location: 'Chicago', type: 'start', order: 0 },
                { id: 'stop1', name: 'Stop 1', location: 'Detroit', type: 'waypoint', order: 1 },
                { id: 'end', name: 'End', location: 'New York', type: 'destination', order: 2 }
            ],
            preferences: {
                maxDrivingHoursPerDay: 6,
                preferredAccommodationTypes: ['hotel', 'motel'],
                preferredAttractionTypes: ['scenic', 'food']
            },
            useAI: false
        };

        function testBasicTrip() {
            const result = document.getElementById('test1-result');
            try {
                // Test basic trip plan creation
                const dayPlans = createBasicTripPlan(mockTripPlan);
                result.innerHTML = `
                    <div class="success">
                        ✅ Basic trip creation successful!<br>
                        Created ${dayPlans.length} day plans<br>
                        Day 1: ${dayPlans[0]?.stops.length || 0} stops<br>
                        Day 2: ${dayPlans[1]?.stops.length || 0} stops<br>
                        Day 3: ${dayPlans[2]?.stops.length || 0} stops
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Error: ${error.message}
                    </div>
                `;
            }
        }

        function testDayPlans() {
            const result = document.getElementById('test2-result');
            try {
                const dayPlans = createBasicTripPlan(mockTripPlan);
                const stats = calculateBasicTripStats(mockTripPlan, dayPlans);
                result.innerHTML = `
                    <div class="success">
                        ✅ Day plans test successful!<br>
                        Total Distance: ${stats.totalDistance} miles<br>
                        Total Duration: ${stats.totalDuration} minutes<br>
                        Total Attractions: ${stats.totalAttractions}<br>
                        Total Accommodations: ${stats.totalAccommodations}
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Error: ${error.message}
                    </div>
                `;
            }
        }

        // Mock functions for testing
        function createBasicTripPlan(tripPlan) {
            const { stops, totalDays, preferences } = tripPlan;
            const dayPlans = [];

            const totalStops = stops.length;
            const stopsPerDay = Math.max(1, Math.ceil(totalStops / totalDays));

            for (let day = 1; day <= totalDays; day++) {
                const startIndex = (day - 1) * stopsPerDay;
                const endIndex = Math.min(startIndex + stopsPerDay, totalStops);
                const dayStops = stops.slice(startIndex, endIndex);

                const estimatedDistance = dayStops.length * 50;
                const estimatedDuration = Math.min(
                    estimatedDistance * 1.2,
                    preferences.maxDrivingHoursPerDay * 60
                );

                const dayPlan = {
                    day,
                    stops: dayStops,
                    totalDistance: estimatedDistance,
                    totalDuration: estimatedDuration,
                    attractions: [],
                    accommodation: null,
                    notes: `Day ${day} of your ${tripPlan.name} trip. ${dayStops.length} stops planned.`,
                    aiGenerated: false
                };

                dayPlans.push(dayPlan);
            }

            return dayPlans;
        }

        function calculateBasicTripStats(tripPlan, dayPlans) {
            const totalDistance = dayPlans.reduce((sum, day) => sum + day.totalDistance, 0);
            const totalDuration = dayPlans.reduce((sum, day) => sum + day.totalDuration, 0);
            const totalAttractions = dayPlans.reduce((sum, day) => sum + day.attractions.length, 0);
            const totalAccommodations = dayPlans.filter(day => day.accommodation).length;

            return {
                totalDistance,
                totalDuration,
                totalAttractions,
                totalAccommodations
            };
        }
    </script>
</body>
</html>
